name: Release desktop applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.2.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: version
        name: Validate tag against project version
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$project_version"
          echo "value=$project_version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: macos-15
            platform: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[packaging,video]"
      - name: Build and smoke-test Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\build_windows.ps1
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Squat GUI" -DestinationPath "Squat_GUI-${{ needs.validate-version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Validate Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\packaging\validate_windows_release.ps1" `
            -ArchivePath "Squat_GUI-${{ needs.validate-version.outputs.version }}-${{ matrix.platform }}.zip" `
            -ExpectedVersion "${{ needs.validate-version.outputs.version }}"
      - name: Build and smoke-test macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build_macos.sh
      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Squat GUI.app" "Squat_GUI-${{ needs.validate-version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Validate macOS archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          SQUAT_GUI_INCLUDE_OPTIONAL_BACKENDS: "0"
        run: bash packaging/validate_macos_release.sh "Squat_GUI-${{ needs.validate-version.outputs.version }}-${{ matrix.platform }}.zip" "${{ needs.validate-version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: Squat-GUI-${{ matrix.platform }}
          path: Squat_GUI-${{ needs.validate-version.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    needs: [validate-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: Squat-GUI-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Squat_GUI-*.zip > SHA256SUMS.txt
      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --verify-tag
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
