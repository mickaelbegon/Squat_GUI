name: Release desktop applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: version
        name: Validate tag against project version
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$project_version"
          echo "value=$project_version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: macos-14
            platform: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[packaging,video]"
      - name: Build and smoke-test Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\build_windows.ps1
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Squat GUI" -DestinationPath "Squat_GUI-${{ needs.validate-version.outputs.version }}-${{ matrix.platform }}.zip"
      - name: Build and smoke-test macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build_macos.sh
      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Squat GUI.app" "Squat_GUI-${{ needs.validate-version.outputs.version }}-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Squat-GUI-${{ matrix.platform }}
          path: Squat_GUI-${{ needs.validate-version.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    needs: [validate-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Squat-GUI-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Squat_GUI-*.zip > SHA256SUMS.txt
      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
