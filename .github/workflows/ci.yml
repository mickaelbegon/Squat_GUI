name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,video,packaging]"

      - name: Verify source formatting and bytecode
        run: |
          git diff --check
          python -m ruff check src tests packaging
          python -m compileall -q src tests packaging/squat_gui_launcher.py

      - name: Run test suite
        env:
          SQUAT_GUI_XLSX_WRITER: openpyxl
        run: python -m pytest -q
